<!DOCTYPE html>
<html>
<head>
    <title>Recomendador de Películas</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: auto; }
        .search-box { margin-bottom: 20px; }
        .movie-card { border: 1px solid #ddd; padding: 15px; border-radius: 8px; text-align: center; }
        img { max-width: 250px; border-radius: 8px; }
    </style>
</head>
<body>
    <h2>🎬 Recomendador de Películas con IA</h2>
    
    <div class="search-box">
        <form action="">
            <input type="text" name="searchMovie" placeholder="Ej: película sobre el espacio..." size="50" value="{{ search_term|default_if_none:'' }}">
            <button type="submit">Recomendar</button>
        </form>
    </div>

    {% if movie %}
        <div class="movie-card">
            <h3>Pelicula recomendada: {{ movie.title }}</h3>
            {% if movie.image %}
                <img src="{{ movie.image.url }}" alt="{{ movie.title }}">
            {% endif %}
            <p><strong>Descripción:</strong> {{ movie.description }}</p>
        </div>
    {% elif search_term %}
        <p>No se encontraron recomendaciones válidas.</p>
    {% endif %}
</body>
</html>
